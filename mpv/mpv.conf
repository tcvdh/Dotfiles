# === RENDERER ===
vo=gpu-next
gpu-api=opengl           # Vulkan broken on your setup, use OpenGL
gpu-context=wayland      # Wayland context

# === HARDWARE DECODING ===
hwdec=nvdec
hwdec-codecs=all
vd-lavc-dr=yes

# === HDR TONE MAPPING ===
tone-mapping=bt.2446a
hdr-compute-peak=yes
hdr-peak-percentile=99.995
tone-mapping-max-boost=1.5
target-prim=bt.709
target-trc=gamma2.2

# === NETWORK / SMB BUFFERING ===
cache=yes
cache-secs=120
demuxer-max-bytes=2GiB
demuxer-max-back-bytes=1GiB
demuxer-readahead-secs=120
